<!doctype html>
<html lang="en" class="anim">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#010101">
  <title>RCMWE — Secure system</title>
  <style>
    /* ============================================================
       Fonts — Orbit Sans + Orbit Display
       TODO: paste your real base64 TTFs into the two src fields
       below. Until then the declared fallbacks are used.
       ============================================================ */
    @font-face {
      font-family: "Orbit Sans";
      font-weight: 400;
      font-display: block;
      src: url(data:font/ttf;base64,PASTE_ORBIT_SANS_TTF_HERE) format("truetype");
    }
    @font-face {
      font-family: "Orbit Display";
      font-weight: 400;
      font-display: block;
      src: url(data:font/ttf;base64,PASTE_ORBIT_DISPLAY_TTF_HERE) format("truetype");
    }

    :root {
      --ink: #ffffff;
      --surface: #010101;
      --orb-reveal: cubic-bezier(.16, 1, .3, 1);
      --orb-soft: cubic-bezier(.25, .8, .28, 1);
      /* brand palette (from logo SVG) */
      --red: #8e2e1f;
      --orange: #e44f21;
      --pink-grad: linear-gradient(180deg, #e44f21 0%, #8e2e1f 100%);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #010101;
    }

    body {
      font-family: "Orbit Sans", Arial, Helvetica, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    img { display: block; max-width: 100%; }
    ul { margin: 0; padding: 0; list-style: none; }
    a { color: inherit; text-decoration: none; }

    /* ---------------- shell ---------------- */

    .viewport {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      inset: 0;
      contain: strict;
      isolation: isolate;
    }

    /* ---------------- z-order ---------------- */

    .orbit-word        { z-index: 3; }
    .flower            { z-index: 2; }
    .support-copy      { z-index: 4; }
    .brand-mark,
    .primary-nav,
    .pill              { z-index: 4; }
    .scrim             { z-index: 9; }
    .sheet             { z-index: 10; }
    .burger            { z-index: 12; }

    /* ---------------- brand mark ---------------- */

    .brand-mark {
      position: absolute;
      top: 2.141745dvh;
      left: 3.854167vw;
      width: clamp(34px, min(3.4375vw, 5.2dvh), 66px);
      height: auto;
    }

    .brand-mark svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---------------- primary nav ---------------- */

    .primary-nav {
      position: absolute;
      inset: 0;
      pointer-events: none;
      font-family: "Orbit Sans", Arial, Helvetica, sans-serif;
    }

    .primary-nav li {
      position: absolute;
      top: 3.426791dvh;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 25px);
      line-height: 1;
      white-space: nowrap;
    }

    .primary-nav li:nth-child(1) { left: 10.104167vw; transform: scaleX(1.165); }
    .primary-nav li:nth-child(2) { left: 17.526042vw; transform: scaleX(1.052); }
    .primary-nav li:nth-child(3) { left: 27.578125vw; transform: scaleX(1.126); }
    .primary-nav li:nth-child(4) { left: 36.171875vw; transform: scaleX(1.168); }
    .primary-nav li:nth-child(5) { left: 45.52vw; transform: scaleX(1.07); }

    .primary-nav a {
      display: block;
      color: #fff;
      pointer-events: auto;
    }

    /* ---------------- pill ---------------- */

    .pill {
      position: absolute;
      top: 2.336449dvh;
      right: 7.5vw;
      height: clamp(34px, 4.439252dvh, 57px);
      display: flex;
      align-items: center;
      padding: 0 1.6em;
      background: #fff;
      color: #010101;
      border-radius: 999px;
      font-size: clamp(11px, min(1.11vw, 1.72dvh), 21px);
      letter-spacing: 0.026923em;
      white-space: nowrap;
    }

    /* ---------------- wordmark ---------------- */

    .orbit-word {
      position: absolute;
      top: 14dvh;
      right: 5vw;
      left: auto;
      margin: 0;
      text-align: right;
      font-family: "Orbit Display", "Times New Roman", Times, serif;
      font-size: min(11vw, 20dvh);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.033708em;
      color: #fff;
      user-select: none;
    }

    .orbit-word__lead {
      display: block;
      font-size: 0.42em;
      letter-spacing: 0.12em;
      color: #fff;
    }

    .orbit-word__mask {
      display: inline-block;
      overflow: hidden;
      padding-bottom: 0.07em;
      margin-bottom: -0.07em;
      vertical-align: bottom;
    }

    .orbit-word__inner {
      display: inline-block;
    }

    .orbit-word__o {
      display: inline-block;
      transform: scaleX(1.0866);
      margin-right: 0.042135em;
    }

    .orbit-word__pink {
      background: var(--pink-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* ---------------- logo stage (was: flower) ---------------- */

    .flower {
      position: absolute;
      top: 18dvh;
      left: 30vw;
      height: min(64dvh, 36vw);
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .flower::before {
      content: "";
      position: absolute;
      inset: -18%;
      background: radial-gradient(closest-side, rgba(228, 79, 33, 0.16), rgba(142, 46, 31, 0.08) 55%, transparent 75%);
      filter: blur(40px);
      pointer-events: none;
    }

    .flower__layer {
      position: absolute;
      inset: -14%;
      overflow: hidden;
    }

    .flower__layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .flower__logo-pixel {
      image-rendering: pixelated;
    }

    .flower__layer--top {
      -webkit-mask-image: linear-gradient(#0000, #0000);
      mask-image: linear-gradient(#0000, #0000);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    /* ---------------- corner copy ---------------- */

    .support-copy {
      position: absolute;
      bottom: 4.361371dvh;
      color: #f7f7f7;
      font-size: clamp(14px, min(1.40625vw, 2.102804dvh), 27px);
      line-height: 1.25;
      white-space: nowrap;
    }

    .support-copy--left  { left: 3.177083vw; transform: scaleX(1.073); }
    .support-copy--right { left: 78.28125vw; transform: scaleX(1.058); }

    .support-copy__inner {
      display: inline-block;
      will-change: transform, opacity;
    }

    /* ---------------- mobile chrome ---------------- */

    .burger {
      position: absolute;
      top: 2.336449dvh;
      right: 7.5vw;
      width: clamp(34px, 4.439252dvh, 57px);
      height: clamp(34px, 4.439252dvh, 57px);
      border-radius: 999px;
      background: #fff;
      border: 0;
      padding: 0;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 12;
    }

    .burger span,
    .burger span::before,
    .burger span::after {
      display: block;
      width: 18px;
      height: 2px;
      background: #010101;
      border-radius: 2px;
      position: relative;
    }

    .burger span::before,
    .burger span::after {
      content: "";
      position: absolute;
      left: 0;
    }
    .burger span::before { top: -6px; }
    .burger span::after  { top: 6px; }

    body.menu-open .burger span { background: transparent; }
    body.menu-open .burger span::before { top: 0; transform: rotate(45deg); }
    body.menu-open .burger span::after  { top: 0; transform: rotate(-45deg); }

    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms var(--orb-soft);
      display: none;
      border: 0;
      padding: 0;
    }

    body.menu-open .scrim { opacity: 1; pointer-events: auto; }

    .sheet {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(78vw, 380px);
      background: rgba(8, 8, 8, 0.86);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      transform: translateX(102%);
      transition: transform 420ms var(--orb-reveal);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8dvh 10vw;
      gap: 1.4dvh;
    }

    body.menu-open .sheet { transform: translateX(0); }

    .sheet a {
      display: block;
      font-family: "Orbit Display", "Times New Roman", Times, serif;
      font-size: clamp(30px, 8.5vw, 56px);
      color: #fff;
      opacity: 0.85;
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .sheet a:hover,
    .sheet a:focus-visible { opacity: 1; transform: translateX(6px); }

    .sheet .sheet__tag {
      font-size: clamp(10px, 2.8vw, 13px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 2dvh;
    }

    /* ============================================================
       Entrance animation (once) — html.anim
       ============================================================ */

    @keyframes orb-word {
      from { transform: translateY(118%); }
      to   { transform: translateY(0); }
    }

    @keyframes orb-subject {
      from { opacity: 0; transform: translateX(-50%) translateY(3.4dvh); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes orb-corner {
      from { opacity: 0; transform: translateY(1.6dvh); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes orb-quiet {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes orb-dim {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* desktop timing */

    html.anim .brand-mark { animation: orb-quiet 620ms var(--orb-soft) 100ms both; }

    html.anim .primary-nav li:nth-child(1) { animation: orb-dim 550ms var(--orb-soft) 180ms both; }
    html.anim .primary-nav li:nth-child(2) { animation: orb-dim 550ms var(--orb-soft) 225ms both; }
    html.anim .primary-nav li:nth-child(3) { animation: orb-dim 550ms var(--orb-soft) 270ms both; }
    html.anim .primary-nav li:nth-child(4) { animation: orb-dim 550ms var(--orb-soft) 315ms both; }
    html.anim .primary-nav li:nth-child(5) { animation: orb-dim 550ms var(--orb-soft) 360ms both; }

    html.anim .pill  { animation: orb-quiet 620ms var(--orb-soft) 340ms both; }

    html.anim .orbit-word__inner { animation: orb-word 1150ms var(--orb-reveal) 300ms both; }

    html.anim .flower { animation: orb-subject 1150ms var(--orb-reveal) 660ms both; }

    html.anim .support-copy__inner { animation: orb-corner 720ms var(--orb-soft) 980ms both; }
    html.anim .support-copy--right .support-copy__inner { animation-delay: 980ms; }

    /* ============================================================
       Responsive
       ============================================================ */

    @media (max-width: 1200px), (max-aspect-ratio: 4 / 5) {
      .orbit-word {
        right: auto;
        left: 0;
        width: 100%;
        text-align: center;
      }
    }

    @media (max-aspect-ratio: 4 / 5) {
      .flower {
        height: min(46dvh, 78vw);
        top: 24dvh;
        left: 50vw;
      }

      .orbit-word {
        font-size: min(21vw, 13dvh);
        top: 9dvh;
      }

      .support-copy {
        white-space: normal;
        max-width: 34vw;
      }

      .support-copy--right { left: 62vw; }
    }

    /* mobile chrome: burger + scrim + sheet */
    @media (max-width: 900px), (max-aspect-ratio: 4 / 5) {
      .primary-nav,
      .pill { display: none; }

      .burger { display: flex; }
      .scrim  { display: block; }
      .sheet  { display: flex; }
    }

    @media (max-width: 900px) {
      .flower {
        height: min(46dvh, 78vw);
        top: 24dvh;
        left: 50vw;
      }
    }

    /* mobile entrance — tighter delays, burger instead of pill/nav */
    @media (max-width: 900px), (max-aspect-ratio: 4 / 5) {
      html.anim .brand-mark { animation-duration: 620ms; animation-delay: 80ms; }
      html.anim .burger { animation: orb-quiet 620ms var(--orb-soft) 320ms both; }
      html.anim .orbit-word__inner { animation-duration: 1150ms; animation-delay: 260ms; }
      html.anim .flower { animation-duration: 1150ms; animation-delay: 580ms; }
      html.anim .support-copy__inner { animation-duration: 720ms; animation-delay: 860ms; }
      html.anim .support-copy--right .support-copy__inner { animation-delay: 860ms; }
    }

    @media (prefers-reduced-motion: reduce) {
      html.anim .stage {
        animation: orb-dim 280ms ease-out both;
      }

      /* gentle fade-only choreography — no slides, no movement */
      html.anim .brand-mark,
      html.anim .primary-nav li,
      html.anim .pill,
      html.anim .burger,
      html.anim .orbit-word__inner,
      html.anim .flower,
      html.anim .support-copy__inner {
        animation-name: orb-dim;
        animation-timing-function: var(--orb-soft);
        animation-fill-mode: both;
      }

      html.anim .brand-mark { animation-duration: 620ms; animation-delay: 100ms; }
      html.anim .primary-nav li:nth-child(1) { animation-duration: 550ms; animation-delay: 180ms; }
      html.anim .primary-nav li:nth-child(2) { animation-duration: 550ms; animation-delay: 225ms; }
      html.anim .primary-nav li:nth-child(3) { animation-duration: 550ms; animation-delay: 270ms; }
      html.anim .primary-nav li:nth-child(4) { animation-duration: 550ms; animation-delay: 315ms; }
      html.anim .primary-nav li:nth-child(5) { animation-duration: 550ms; animation-delay: 360ms; }
      html.anim .pill { animation-duration: 620ms; animation-delay: 340ms; }
      html.anim .orbit-word__inner { animation-duration: 800ms; animation-delay: 300ms; }
      html.anim .flower { animation-duration: 800ms; animation-delay: 660ms; }
      html.anim .support-copy__inner { animation-duration: 720ms; animation-delay: 980ms; }
      html.anim .support-copy--right .support-copy__inner { animation-delay: 980ms; }
    }

    /* halftone texture — pixel-art theme */
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 4px 4px;
    }

    .primary-nav a {
      transition: color 200ms ease;
    }

    .primary-nav a:hover {
      color: var(--orange);
    }

    .hint {
      position: absolute;
      bottom: 4.361371dvh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      color: rgba(255, 255, 255, 0.55);
      font-size: clamp(10px, min(1.1vw, 1.6dvh), 15px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 700ms ease;
    }

    body.trail-seen .hint {
      opacity: 0;
    }

    :focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';

      /* ---------------- entrance: drop .anim after intro ---------------- */

      function finishIntro() {
        document.documentElement.classList.remove('anim');
      }
      window.addEventListener('load', function () {
        setTimeout(finishIntro, 6000);
      });
      setTimeout(finishIntro, 6000);

      /* ---------------- mobile menu ---------------- */

      var burger = document.querySelector('.burger');
      var scrim = document.querySelector('.scrim');
      var sheet = document.getElementById('mobile-menu');
      var sheetLinks = Array.prototype.slice.call(sheet.querySelectorAll('a'));

      function setMenu(open) {
        document.body.classList.toggle('menu-open', open);
        burger.setAttribute('aria-expanded', String(open));
        sheet.setAttribute('aria-hidden', String(!open));
        if (open) sheet.removeAttribute('inert');
        else sheet.setAttribute('inert', '');
        if (open) burger.focus();
      }

      burger.addEventListener('click', function () {
        setMenu(!document.body.classList.contains('menu-open'));
      });
      scrim.addEventListener('click', function () { setMenu(false); });
      sheetLinks.forEach(function (a) {
        a.addEventListener('click', function () { setMenu(false); });
      });
      document.addEventListener('keydown', function (e) {
        if (!document.body.classList.contains('menu-open')) return;
        if (e.key === 'Escape') { setMenu(false); return; }
        if (e.key === 'Tab') {
          var first = sheetLinks[0];
          var last = sheetLinks[sheetLinks.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault(); last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault(); first.focus();
          }
        }
      });
      sheet.setAttribute('aria-hidden', 'true');
      sheet.setAttribute('inert', '');

      /* ---------------- fade out when leaving to the portfolio ---------------- */

      Array.prototype.forEach.call(document.querySelectorAll('a[rel="external"]'), function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          var target = a.getAttribute('href');
          var vp = document.querySelector('.viewport');
          vp.style.transition = 'opacity 300ms ease';
          vp.style.opacity = '0';
          setTimeout(function () { window.location.href = target; }, 300);
        });
      });

            /* ---------------- logo art pipeline (hover reveal) ---------------- */

      var PIXEL_GRID = 128;
      var logoImg = document.querySelector('.flower__logo');
      var pixelImg = document.querySelector('.flower__logo-pixel');
      var ART_RAMP = [
        [0, [20, 5, 31]],
        [40, [61, 17, 96]],
        [80, [109, 31, 138]],
        [120, [161, 59, 127]],
        [160, [224, 95, 168]],
        [200, [253, 134, 219]],
        [230, [255, 201, 214]],
        [255, [255, 243, 214]]
      ];
      var ART_PINK = [253, 134, 219];
      var ART_HALO = [90, 27, 107];

      function artClamp255(v) {
        return v < 0 ? 0 : v > 255 ? 255 : v;
      }

      function artHueRotate(rgb, deg) {
        var rad = (deg * Math.PI) / 180;
        var s = Math.sin(rad), c = Math.cos(rad);
        var r = rgb[0], g = rgb[1], b = rgb[2];
        var a00 = 0.213 + 0.787 * c - 0.213 * s;
        var a01 = 0.715 - 0.715 * c - 0.715 * s;
        var a02 = 0.072 - 0.072 * c + 0.928 * s;
        var a10 = 0.213 - 0.213 * c + 0.143 * s;
        var a11 = 0.715 + 0.285 * c + 0.140 * s;
        var a12 = 0.072 - 0.072 * c - 0.283 * s;
        var a20 = 0.213 - 0.213 * c - 0.787 * s;
        var a21 = 0.715 - 0.715 * c + 0.715 * s;
        var a22 = 0.072 + 0.928 * c;
        return [
          artClamp255(Math.round(r * a00 + g * a01 + b * a02)),
          artClamp255(Math.round(r * a10 + g * a11 + b * a12)),
          artClamp255(Math.round(r * a20 + g * a21 + b * a22))
        ];
      }

      function artSampleRamp(v) {
        for (var i = 1; i < ART_RAMP.length; i++) {
          if (v <= ART_RAMP[i][0]) {
            var v0 = ART_RAMP[i - 1][0], c0 = ART_RAMP[i - 1][1];
            var v1 = ART_RAMP[i][0], c1 = ART_RAMP[i][1];
            var t = (v - v0) / (v1 - v0);
            return [
              Math.round(c0[0] + (c1[0] - c0[0]) * t),
              Math.round(c0[1] + (c1[1] - c0[1]) * t),
              Math.round(c0[2] + (c1[2] - c0[2]) * t)
            ];
          }
        }
        return ART_RAMP[ART_RAMP.length - 1][1];
      }

      function processLogo(img) {
        var w = img.naturalWidth, h = img.naturalHeight;

        /* 1 — key out the background square (#8e2e1f) */
        var src = document.createElement('canvas');
        src.width = w; src.height = h;
        var sx = src.getContext('2d');
        sx.drawImage(img, 0, 0);
        var sd = sx.getImageData(0, 0, w, h);
        var sp = sd.data;
        for (var i = 0; i < sp.length; i += 4) {
          if (Math.abs(sp[i] - 142) <= 28 && Math.abs(sp[i + 1] - 46) <= 28 && Math.abs(sp[i + 2] - 31) <= 28) {
            sp[i + 3] = 0;
          }
        }
        sx.putImageData(sd, 0, 0);

        /* 2 — clean: sunset glow disc + keyed art */
        var clean = document.createElement('canvas');
        clean.width = w; clean.height = h;
        var cx = clean.getContext('2d');
        var disc = cx.createRadialGradient(w / 2, h * 0.44, 0, w / 2, h * 0.44, w * 0.52);
        disc.addColorStop(0, 'rgba(228, 79, 33, 0.95)');
        disc.addColorStop(0.55, 'rgba(228, 79, 33, 0.3)');
        disc.addColorStop(0.82, 'rgba(228, 79, 33, 0)');
        cx.fillStyle = disc;
        cx.fillRect(0, 0, w, h);
        cx.drawImage(src, 0, 0);

        /* 3 — pixel: fine grid, multicolor ramp, halftone dots, violet halo
              dots on a 3x canvas so small dot radii actually rasterize */
        var SCALE = 3;
        var size = PIXEL_GRID * SCALE;
        var pixel = document.createElement('canvas');
        pixel.width = size; pixel.height = size;
        var px = pixel.getContext('2d');
        px.drawImage(src, 0, 0, size, size);
        var pd = px.getImageData(0, 0, size, size);
        var pp = pd.data;
        var half = PIXEL_GRID / 2;
        var dotR = 1.4;
        for (var yy = 0; yy < PIXEL_GRID; yy++) {
          for (var xx = 0; xx < PIXEL_GRID; xx++) {
            var ii = ((yy * SCALE + 1) * size + (xx * SCALE + 1)) * 4;
            var cr, cg, cb, ca;
            if (pp[ii + 3] > 24) {
              var v = Math.max(pp[ii], pp[ii + 1], pp[ii + 2]);
              var col = artSampleRamp(v);
              if (v > 100) {
                var tt = yy / PIXEL_GRID;
                col[0] = Math.round(col[0] + (255 - col[0]) * (1 - tt) * 0.65);
                col[1] = Math.round(col[1] + (218 - col[1]) * (1 - tt) * 0.65);
                col[2] = Math.round(col[2] + (140 - col[2]) * (1 - tt) * 0.65);
                col[0] = Math.round(col[0] + (ART_PINK[0] - col[0]) * tt * 0.55);
                col[1] = Math.round(col[1] + (ART_PINK[1] - col[1]) * tt * 0.55);
                col[2] = Math.round(col[2] + (ART_PINK[2] - col[2]) * tt * 0.55);
              }
              var shift = (((xx * 73856093) ^ (yy * 19349663)) % 21) - 10;
              col = artHueRotate(col, shift);
              cr = col[0]; cg = col[1]; cb = col[2]; ca = pp[ii + 3];
            } else {
              var dd = Math.hypot(xx - half + 0.5, yy - half * 0.88 + 0.5) / half;
              var glow = Math.max(0, 1 - dd * 1.05);
              cr = ART_HALO[0]; cg = ART_HALO[1]; cb = ART_HALO[2];
              ca = Math.round(glow * glow * 140);
            }
            px.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (ca / 255).toFixed(3) + ')';
            px.beginPath();
            px.arc(xx * SCALE + 1.5, yy * SCALE + 1.5, dotR, 0, Math.PI * 2);
            px.fill();
          }
        }

        logoImg.src = clean.toDataURL('image/png');
        pixelImg.src = pixel.toDataURL('image/png');
      }

      if (logoImg.complete) processLogo(logoImg);
      else logoImg.addEventListener('load', function () { processLogo(logoImg); });

      /* ---------------- morph reveal trail ---------------- */

      var TRAIL_MAX_POINTS = 60;
      var TRAIL_HEAD_R = 70;
      var TRAIL_NOISE_AMP = 44;
      var TRAIL_BLOB_PTS = 24;
      var TRAIL_FADE_SPEED = 0.92;
      var TRAIL_SAMPLE_DIST = 8;

      var stage = document.querySelector('.stage');
      var bgLayer = document.querySelector('.flower__layer--bg');
      var topLayer = document.querySelector('.flower__layer--top');
      var points = [];
      var hovering = false;
      var headRadius = 0;
      var time = 0;
      var lastX = null;
      var lastY = null;

      function MorphTrailLayer(img, invert) {
        this.canvas = document.createElement('canvas');
        this.canvas.style.display = 'none';
        document.body.appendChild(this.canvas);
        this.ctx = this.canvas.getContext('2d');
        this.img = img;
        this.invert = invert;
        this.dpr = Math.max(1, window.devicePixelRatio || 1);
        this.resize();
      }

      MorphTrailLayer.prototype.resize = function () {
        var rect = this.img.getBoundingClientRect();
        this.rect = rect;
        this.w = Math.max(1, Math.round(rect.width * this.dpr));
        this.h = Math.max(1, Math.round(rect.height * this.dpr));
        this.canvas.width = this.w;
        this.canvas.height = this.h;
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      };

      MorphTrailLayer.prototype.applyMask = function () {
        var url = 'url(' + this.canvas.toDataURL() + ')';
        this.img.style.webkitMaskImage = url;
        this.img.style.maskImage = url;
        this.img.style.webkitMaskSize = '100% 100%';
        this.img.style.maskSize = '100% 100%';
        this.img.style.webkitMaskRepeat = 'no-repeat';
        this.img.style.maskRepeat = 'no-repeat';
      };

      MorphTrailLayer.prototype.paint = function () {
        var ctx = this.ctx;
        if (this.invert) {
          ctx.clearRect(0, 0, this.rect.width, this.rect.height);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#ffffff';
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, this.rect.width, this.rect.height);
          ctx.globalCompositeOperation = 'destination-out';
        }
        for (var i = 0; i < points.length; i++) {
          var p = points[i];
          ctx.globalAlpha = p.alpha;
          drawMorphBlob(ctx, p.x, p.y, p.r, time, p.seed);
        }
        ctx.globalAlpha = 1;
        this.applyMask();
      };

      function drawMorphBlob(ctx, cx, cy, r, t, seed) {
        if (r < 2) return;
        var pts = [];
        var i, angle, n1, n2, n3, noise, rr, x, y;
        for (i = 0; i <= TRAIL_BLOB_PTS; i++) {
          angle = (i / TRAIL_BLOB_PTS) * Math.PI * 2;
          n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
          n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
          n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
          noise = (n1 + n2 + n3) * TRAIL_NOISE_AMP * (r / TRAIL_HEAD_R);
          rr = r + noise;
          x = cx + Math.cos(angle) * rr;
          y = cy + Math.sin(angle) * rr;
          pts.push([x, y]);
        }
        ctx.beginPath();
        ctx.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
        for (i = 1; i < pts.length - 1; i++) {
          ctx.quadraticCurveTo(
            pts[i][0], pts[i][1],
            (pts[i][0] + pts[i + 1][0]) / 2,
            (pts[i][1] + pts[i + 1][1]) / 2
          );
        }
        ctx.quadraticCurveTo(
          pts[pts.length - 1][0], pts[pts.length - 1][1],
          (pts[pts.length - 1][0] + pts[0][0]) / 2,
          (pts[pts.length - 1][1] + pts[0][1]) / 2
        );
        ctx.closePath();
        ctx.fill();
      }

      function toFlowerSpace(clientX, clientY) {
        var rect = bgLayer.getBoundingClientRect();
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function onMove(e) {
        var p = toFlowerSpace(e.clientX, e.clientY);
        hovering = true;
        document.body.classList.add('trail-seen');
        if (headRadius > 5) {
          var dist = lastX === null ? Infinity : Math.hypot(p.x - lastX, p.y - lastY);
          if (dist > TRAIL_SAMPLE_DIST) {
            if (points.length >= TRAIL_MAX_POINTS) points.shift();
            points.push({
              x: p.x,
              y: p.y,
              r: headRadius,
              alpha: 1,
              seed: Math.random() * 100
            });
            lastX = p.x;
            lastY = p.y;
          }
        } else {
          lastX = p.x;
          lastY = p.y;
        }
      }

      stage.addEventListener('mousemove', onMove);
      stage.addEventListener('mouseenter', onMove);
      stage.addEventListener('mouseleave', function () {
        hovering = false;
      });

      var layerBg = new MorphTrailLayer(bgLayer, false);
      var layerTop = new MorphTrailLayer(topLayer, true);

      window.addEventListener('resize', function () {
        layerBg.resize();
        layerTop.resize();
      });

      requestAnimationFrame(function frame() {
          var targetR = hovering ? TRAIL_HEAD_R : 0;
          headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);

          var i;
          for (i = 0; i < points.length; i++) {
            points[i].alpha *= TRAIL_FADE_SPEED;
            points[i].r *= 0.995;
          }
          points = points.filter(function (p) { return p.alpha >= 0.01; });

          layerBg.paint();
          layerTop.paint();
          time += 0.016;

          requestAnimationFrame(frame);
        });
    })();
  </script>
</body>
</html>
